<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Osobní Stránka</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        p {
            line-height: 1.6;
            color: #666;
        }
        .contact-btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .contact-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ahoj, já jsem [Eva Dušátková]</h1>
        
        <p>Jsem studentka gymnázia a ráda objímám stromy.</p>
        
        <p>Aktuálně se zajímám o GitHub Pages a webový design.</p>

        <a href="mailto:tvuj@email.cz" class="contact-btn">Napiš mi</a>
    </div>

</body>
</html>
